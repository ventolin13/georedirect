global
    maxconn 200000

resolvers k8s
    nameserver dns 10.96.0.10:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode tcp
    timeout connect 3s
    timeout client  5s
    timeout server  5s

frontend georedirect_in
    bind *:443
    default_backend georedirect_app

backend georedirect_app
    balance roundrobin
    default-server inter 2s fall 3 rise 2 send-proxy-v2
    server-template pod 100 georedirect.default.svc.cluster.local:8443 check resolvers k8s init-addr none
